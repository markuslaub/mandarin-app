<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Sprachinseln</title>
<meta name="description" content="Sprachinseln, Shadowing, aktive Erinnerung und Tonkurven-Bewertung für Mandarin.">
<meta name="theme-color" content="#b3261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e0d8;
  --accent:#b3261e; --accent-soft:#f6e3e1; --hl:#fff3c4;
  --good:#2e7d32; --good-soft:#e3f1e4; --mid:#b26a00; --mid-soft:#fbefd9; --bad:#c62828; --bad-soft:#fbe3e3;
  --refline:#9a9aa2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17171a; --card:#222226; --ink:#ececef; --muted:#a0a0a8; --line:#34343a;
    --accent:#ff7a70; --accent-soft:#3a2523; --hl:#4a4320;
    --good:#6fcf74; --good-soft:#1f3321; --mid:#f0b44c; --mid-soft:#3a2f1a; --bad:#ff7a70; --bad-soft:#3a2323; --refline:#6c6c74; }
}
:root[data-theme="dark"]{ --bg:#17171a; --card:#222226; --ink:#ececef; --muted:#a0a0a8; --line:#34343a;
    --accent:#ff7a70; --accent-soft:#3a2523; --hl:#4a4320;
    --good:#6fcf74; --good-soft:#1f3321; --mid:#f0b44c; --mid-soft:#3a2f1a; --bad:#ff7a70; --bad-soft:#3a2323; --refline:#6c6c74; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 110px}
h1{font-size:1.5rem;margin:0 0 2px} h2{font-size:1.15rem;margin:18px 0 8px} h3{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.big{font-size:1.1rem;padding:14px 22px;min-height:54px;width:100%}
.btn.small{padding:5px 12px;min-height:36px;font-size:.92rem}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.link{background:none;border:none;color:var(--accent);padding:6px 0;min-height:40px}
.muted{color:var(--muted)} .small{font-size:.9rem}
.msg{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 4px max(6px,env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:.72rem;padding:4px 6px;min-width:58px;min-height:48px}
nav.tabs button .i{font-size:1.25rem;line-height:1.3}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* Schritte */
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:none}
.steps .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.steps li.done .n{background:var(--good);color:#fff}
.steps .t{flex:1}
.steps .t b{display:block}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.progress > div{height:100%;background:var(--accent);width:0}
.stephead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.stephead .lbl{font-size:.85rem;color:var(--muted)}

/* Satz */
.zh{font-size:1.9rem;line-height:1.9;word-break:break-all}
.zh .w{display:inline-block;border:none;background:none;padding:0 1px;margin:0;border-radius:6px;text-align:center;vertical-align:bottom;line-height:1.2;font-size:inherit}
.zh .w .p{display:block;font-size:.85rem;color:var(--muted);min-height:1.1em;white-space:nowrap}
.zh .w .h{display:block}
.zh .w:hover,.zh .w.sel{background:var(--hl)}
.zh .pu{display:inline-block;vertical-align:bottom;line-height:1.2}
.zh .grp{display:inline-block;white-space:nowrap;vertical-align:bottom}
.zh.nopy .w .p{display:none}
.de{font-size:1.05rem;margin:6px 0}
.big-de{font-size:1.35rem;font-weight:600;margin:6px 0 10px}
.cover{background:var(--accent-soft);border-radius:10px;padding:18px;text-align:center;color:var(--accent)}
.hint{font-size:1.2rem;margin:8px 0;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate .btn{border-radius:12px;padding:10px 4px}
.rate .g{border-color:var(--good);color:var(--good)} .rate .m{border-color:var(--mid);color:var(--mid)} .rate .b{border-color:var(--bad);color:var(--bad)}
.shadow-ind{font-size:.95rem;font-weight:600;color:var(--accent);min-height:1.5em}

/* Tonkurve */
.tonebox{margin-top:12px}
.tonebox canvas{width:100%;height:190px;display:block;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.score{font-size:2rem;font-weight:700}
.syl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.syl span{border-radius:8px;padding:3px 8px;font-size:.95rem}
.syl .g{background:var(--good-soft);color:var(--good)} .syl .m{background:var(--mid-soft);color:var(--mid)} .syl .b{background:var(--bad-soft);color:var(--bad)} .syl .n{background:var(--line);color:var(--muted)}
.notes{margin:4px 0 0;padding-left:18px}
.legend{font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin:0 4px 0 8px}

/* Listen */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.item .main{flex:1;min-width:0}
.item .zhs{font-size:1.2rem}
.item .meta{color:var(--muted);font-size:.88rem}
.badge{font-size:.75rem;border-radius:6px;padding:1px 7px;white-space:nowrap}
.badge.g{background:var(--good-soft);color:var(--good)} .badge.m{background:var(--mid-soft);color:var(--mid)} .badge.b{background:var(--bad-soft);color:var(--bad)} .badge.n{background:var(--line);color:var(--muted)}
.pkg{opacity:1} .pkg.locked{opacity:.6}

/* Panel Wort */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding:16px 18px max(20px,env(safe-area-inset-bottom));z-index:40}
.sheet .hz{font-size:2.4rem;line-height:1.2}
.sheet .py{font-size:1.15rem;color:var(--accent)}
.sheet .art{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.sheet .chars{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sheet .chars div{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.sheet .chars .c{font-size:1.5rem}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.9rem}
.cal .h{color:var(--muted);font-size:.78rem}
.cal .d{padding:6px 0;border-radius:8px}
.cal .d.on{background:var(--good);color:#fff;font-weight:600}
.cal .d.today{outline:2px solid var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.4rem}

/* Playlist */
.now{font-size:1.5rem;min-height:2.4em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:var(--card);padding:8px 14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
label.chk{display:flex;gap:8px;align-items:center;min-height:40px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:38px}
.textview p{margin:0 0 14px}
.textview .de{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>中文 Sprachinseln</h1>
    <p class="sub" id="subline">Sprachinseln · Shadowing · Aktive Erinnerung</p>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="heute"><span class="i">☀︎</span>Heute</button>
  <button data-tab="inseln"><span class="i">⛰</span>Inseln</button>
  <button data-tab="hoeren"><span class="i">🎧</span>Hören</button>
  <button data-tab="texte"><span class="i">📖</span>Texte</button>
  <button data-tab="stand"><span class="i">📅</span>Fortschritt</button>
</nav>
<div id="veil" class="veil hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<audio id="player" preload="auto" playsinline></audio>
<audio id="listplayer" preload="auto" playsinline></audio>
<script src="dsp.js"></script>
<script src="app.js"></script>
</body>
</html>
